services:
  valkey-node-0:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.2
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-0
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'

  valkey-node-1:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.3
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-1
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'

  valkey-node-2:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.4
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-2
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'

  valkey-node-3:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.5
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-3
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'

  valkey-node-4:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.6
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-4
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'

  valkey-node-5:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.7
    volumes:
      - type: tmpfs
        target: /bitnamilegacy/valkey-node-5
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'
  
  valkey-cluster-init:
    image: bitnamilegacy/valkey-cluster:7.2.5-debian-12-r4
    networks:
      cluster_subnet:
        ipv4_address: 172.16.1.8
    depends_on:
      - valkey-node-0
      - valkey-node-1
      - valkey-node-2
      - valkey-node-3
      - valkey-node-4
      - valkey-node-5
    environment:
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_CLUSTER_REPLICAS=1'
      - 'VALKEY_NODES=valkey-node-0 valkey-node-1 valkey-node-2 valkey-node-3 valkey-node-4 valkey-node-5'
      - 'VALKEY_CLUSTER_CREATOR=yes'

networks:
  cluster_subnet:
    name: cluster_subnet
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.1.0/24
          gateway: 172.16.1.1